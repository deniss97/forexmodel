# ======================================================================
# Серебро: РЕГРЕССИЯ хода за горизонт в ATR вместо трёх классов (RESULTS часть V, п. 6).
#
# Три разметки дали одну и ту же модель «про волатильность» с p_long ≈ p_short.
# Здесь модель предсказывает сам ход (target_move), сигнал — по порогу
# catboost.reg_signal_atr, а EV-фильтр берёт предсказанный ход напрямую.
# Мета-модель выключена: она строится на OOF классификатора. Проверять только
# через scripts/walk_forward.py. Отличия от configs/silver.yaml:
#   1. labeling.mode: direction — метка по знаку хода за horizon часов в ATR (порог dir_atr),
#      а не по касанию барьеров: модель должна учиться направлению, а не волатильности;
#   2. features.use_regime_features: true — vr4_240/720, acf1_240/720;
#   3. nn.enabled: false — на серебре сеть бесполезна (edge −0.0007), а память
#      на этой машине ограничена;
#   4. свой run_name, чтобы не перетереть silver_1h.
# Гейт входа, стоп 2 ATR и EV по барьерам разметки — как в silver.yaml.
#
#   python -m forexmodel.cli run -c configs/silver_direction.yaml --split sim
#   python -m forexmodel.cli backtest -c configs/silver_direction.yaml --split test
# ======================================================================

data:
  csv_path: data/raw/XAGUSD_1m_full.csv
  time_col: time
  volume_candidates: [volume]
  base_timeframe: 1h
  signal_tf_minutes: 60
  splits:
    train_end: "2024-12-31 00:00:00"
    test_start: "2024-12-31 00:00:00"
    test_end: "2025-12-31 00:00:00"
    sim_start: "2025-12-31 00:00:00"

features:
  sma_periods: [3, 7]
  ema_periods: [3, 7]
  rsi_period: 4
  adx_period: 4
  macd_fast: 3
  macd_slow: 8
  macd_signal: 3
  atr_period: 14
  bb_period: 5
  bb_std: 2
  lags: [1, 2, 5, 8, 13]
  rsi_z_window: 200
  extension_windows: [6, 12, 24]
  use_extension_features: true
  use_regime_features: true
  regime_windows: [240, 720]
  use_volume_features: false
  dimensionless_only: true

labeling:
  mode: direction
  horizon: 4           # 4 часа: единственный горизонт, где test-2025 не убыточен (см. документ)
  dir_atr: 0.3
  tp_atr: 1.5          # для формулы EV (ev_tp_atr / ev_sl_atr = null берут их отсюда)
  sl_atr: 0.75
  atr_col: atr_14
  use_next_open: true
  use_uniqueness_weights: true

trend:
  enabled: true
  mode: early
  timeframe: 4h
  slope_period: 6
  adx_period: 9
  adx_min: 15
  adx_max: 40
  require_adx_rising: true

trend_gate:
  enabled: true
  require_adx_rising: false
  update_every_bar: true
  hold_bars: 2

catboost:
  objective: regression
  reg_signal_atr: 0.3   # |предсказанный ход| >= 0.3 ATR -> сигнал
  iterations: 2000
  learning_rate: 0.05
  depth: 6
  l2_leaf_reg: 6.0
  early_stopping_rounds: 100
  test_size: 0.2
  val_size: 0.15
  use_class_weights: true
  refit_on_full_train: true

nn:
  enabled: false

meta:
  enabled: false

simulation:
  exit_mode: trailing
  commission_pct: 0.04
  open_delay_minutes: 61
  sl_atr: 2.0
  tp_atr: 2.0
  trail_atr: 1.5
  activate_atr: 1.0
  signal_source: cb
  use_expected_value_filter: true
  min_expected_value_pct: 0.0
  use_trend_filter: true
  trend_col: trend_gate
  allow_overlapping_positions: false

paths:
  artifacts_dir: artifacts
  reports_dir: reports
  run_name: silver_reg
