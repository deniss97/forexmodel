# Счёт для торговли по сигналам контура (ТЗ инференса Тимура, решения 26.10 и 28.10): Т-Инвестиции, только лонг.
# Контур решает, какой сигнал берём на счёт, а какой — в журнал альтернативных сделок (scripts/live_account.py);
# исполнение — кнопками в группе Telegram (scripts/live_bot.py). Большинство строк меняется и командой бота /set.
capital: 15000            # рублей на счёте стратегий (пробный этап — не больше 15 000, созвон 26.10)
slot: 5000                # рублей на одну сделку; позиция округляется вниз до целых лотов
max_positions: 3          # открытых позиций одновременно
# лот дороже слота (LKOH ~6.1 тыс. ₽) — берём один лот, если свободных денег хватает на него
lot_over_slot: true
max_loss_pct: 10          # потолок риска сделки: стоп не дальше −10% от входа; стоп стратегии ближе — ставим стоп стратегии
one_position_per_stock: true   # бумага уже в позиции по одной стратегии — сигнал другой стратегии идёт в журнал альтернативных
priority: [S42, S46, S48]      # если в один час сигналов больше, чем свободных слотов
strategies:               # на счёт — только S42 (T50, созвон 26.10); S46 и S48 — бумажный режим (live_iterator.py); off — не брать
  S42: [sber, gazp, lkoh]
  S46: off
  S48: off
weekends: false           # сигналы торгов выходного дня на счёт не берём (T51, созвон 26.10)
mode: button              # button — «ОТКРЫТЬ» с кнопками «Исполнить» (API) / «Купил сам»; manual — только уведомления
broker: live              # live — боевой счёт Т-Инвестиций; sandbox — песочница (заявки не уходят на биржу)
max_slippage_pct: 0.3     # «Исполнить»: покупка лимитом не дороже цены сигнала + 0.3%
order_attempts: 3         # попыток выставить заявку (ТЗ: позиция может не открыться с первого раза)
order_wait_sec: 20        # сколько ждать исполнения одной заявки, секунд
near_stop_pct: 1.0        # тревога «близко к стопу»: до стопа меньше 1%
volatility_x: 2.5         # тревога о волатильности: ход часа в 2.5 раза больше обычного (медиана за 20 дней)
monitor_min: 5            # как часто бот смотрит цены открытых позиций, минут
dd_warn_pct: 8            # просадка результата счёта от пика, % депозита: «внимание» (разбор 28.10, раздел 7)
dd_stop_pct: 12           # то же, «стоп»: по договорённости /stop и разбор за 1–2 дня — бот только сообщает
dividend_days: 3          # за сколько дней до последнего дня покупки предупреждать об отсечке по открытой позиции
account: null             # номер счёта у брокера (или его конец); null — первый счёт токена (22.10 токен видел один брокерский)
stop: false               # стоп-кран: true — новые сделки не открываются (то же — файл reports/live/STOP; в боте — /stop)
lots_file: docs/results/launch_portfolio/lots.json   # лоты бумаг (Т-Инвестиции); нет бумаги — спрашиваем у брокера
