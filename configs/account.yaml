# Счёт для торговли по сигналам контура (ТЗ инференса 26.10 и условия Дениса): Т-Инвестиции, только лонг.
# Сделки на первом этапе делаем руками по уведомлениям; контур решает, какой сигнал берём на счёт, а какой — в журнал
# альтернативных сделок (не хватило слота или денег). scripts/live_account.py.
capital: 15000            # рублей на счёте стратегий
slot: 5000                # рублей на одну сделку; позиция округляется вниз до целых лотов
max_positions: 3          # открытых позиций одновременно
# лот дороже слота (LKOH ~6.1 тыс. ₽) — берём один лот, если свободных денег хватает на него
lot_over_slot: true
max_loss_pct: 10          # потолок риска сделки: стоп не дальше −10% от входа; стоп стратегии ближе — ставим стоп стратегии
one_position_per_stock: true   # бумага уже в позиции по одной стратегии — сигнал другой стратегии идёт в журнал альтернативных
priority: [S42, S46, S48]      # если в один час сигналов больше, чем свободных слотов
strategies:               # что торгуем: весь набор (H67) — S42 на трёх бумагах, S46 и S48 на 19
  S42: [sber, gazp, lkoh]
  S46: all
  S48: all
mode: manual              # manual — уведомления, сделки руками; api — позже (scripts/live_trade.py)
account: null             # номер счёта у брокера (или его конец); null — первый счёт токена (22.10 токен видел один брокерский)
stop: false               # стоп-кран: true — новые сделки не открываются (то же — файл reports/live/STOP)
lots_file: docs/results/launch_portfolio/lots.json   # лоты бумаг (Т-Инвестиции); нет бумаги — спрашиваем у брокера
