[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forexmodel"
version = "0.1.0"
description = "ML-пайплайн для внутридневной торговли: фичи -> triple-barrier разметка -> CatBoost/CNN-BiLSTM -> мета-модель -> минутная симуляция"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "catboost>=1.2",
]

[project.optional-dependencies]
nn = ["torch>=2.0"]
viz = ["plotly>=5.18", "matplotlib>=3.7"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
forexmodel = "forexmodel.cli:main"

[tool.setuptools.packages.find]
include = ["forexmodel*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
