# Проверки, у которых нет журнала сделок штатного симулятора (быстрые расчёты, статистика паттернов,
# точность прогноза). Их выводы — в документах; повторять их через журнал имеет смысл только если
# гипотеза возвращается в работу.
no_log:
  - {title: "23 паттерна цены на удержании 10 ч и 2–5 дней", result: "на 10 ч ни один не окупает комиссию; на 2–5 днях импульс продолжается (z до 3.2)", doc: results/patterns.md}
  - {title: "Модель CatBoost на паттерн («брать ли сделку импульса»)", result: "разница с «без модели» около нуля", doc: results/patterns.md}
  - {title: "Признак бокового рынка", result: "ни один признак не разделяет годы одинаково в обоих периодах", doc: results/patterns.md}
  - {title: "Ранний вход на 15 и 30 минутах", result: "золото лучше, серебро и LKOH хуже", doc: results/patterns.md}
  - {title: "Диффузионная модель TokDiT как фильтр импульса", result: "серебро +68% → +17%", doc: results/patterns.md}
  - {title: "Сетка выхода быстрым движком (48–720 ч × 3–8 ATR)", result: "плато 168–240 ч, трейлинг 6 ATR", doc: results/patterns.md}
  - {title: "Порог импульса в %, меньший порог, серая зона EMA5", result: "3 ATR лучше всех; серая зона на входы не влияет", doc: results/impulse_instruments.md}
  - {title: "Перенос стопа в безубыток после +2…4 ATR", result: "+144% → +112…129% на 8 инструментах", doc: results/impulse_instruments.md}
  - {title: "Фильтр дневного тренда (SMA50 / SMA200)", result: "сделки против тренда слабее, но в плюсе; фильтр снижает итог", doc: results/impulse_instruments.md}
  - {title: "Досрочное закрытие по вероятности дойти до цели", result: "хуже удержания; слой на карте сделок показывает каждую такую сделку", doc: results/position_management.md}
  - {title: "Подбор тренд-гейта под импульс и 300 случайных гейтов", result: "подбор хуже фиксированного; гейт C — удача (99-й процентиль)", doc: results/trend_filter_ema.md}
  - {title: "Контекст импульса: сосед, час, день, сила", result: "знак эффекта меняется между периодами", doc: results/audit.md}
  - {title: "Дрейф или сигнал", result: "рост рынка даёт 13% итога", doc: results/audit.md}
  - {title: "TokDiT и синтетические данные для прогноза направления", result: "AUC 0.512 — как простое правило отката", doc: results/volatility_and_tokdit.md}
  - {title: "Важность и отбор признаков CatBoost", result: "модель опирается на время суток и волатильность; любой отбор хуже всех признаков", doc: results/trend_filter_ema.md}
  - {title: "Лента сделок: дельта за окна и «поглощение»", result: "знак эффекта меняется между 2024 и 2025–26", doc: results/lkoh_features_orderflow.md}
  - {title: "Возврат к среднему внутри дня на LKOH", result: "до комиссии до +0.13%, после — не значим", doc: results/model_changelog.md}
  - {title: "Фильтры входа CatBoost: против свечи, пауза после стопа, растяжение", result: "не работают на обоих инструментах", doc: results/silver_1h_cb/trade_review.md}
  - {title: "Выход из «застывших» сделок импульса (H34): через K часов трейлинг не включился и цена ближе Y ATR от входа — закрыть", result: "быстрый расчёт по часовым свечам поверх сделок B01, издержки базы: выбор 72 ч / 1 ATR по 2016–2020; на проверке хуже базы — металлы +41% → +22%, портфель 4 −2% → −14%", doc: results/strategy_week_1012.md}
  - {title: "Вход против уже ушедшей цены (H33): ход за 72 / 120 ч до сигнала против сделки", result: "разведка на сделках B01, только выбор 2016–2020: монотонной связи с результатом нет, правила для фильтра нет — проверку не трогали", doc: results/strategy_week_1012.md}
