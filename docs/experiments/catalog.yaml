    doc: results/trend_filter_ema.md
    dividends: true
    costs: *base_costs
    sources:
      silver: [silver_b1flip__impulse_6_3]
      gold: [gold_b1flip__impulse_6_3]
      lkoh: [lkoh_b1flip__impulse_6_3]
      gazp: [gazp_b1flip__impulse_6_3]
      sber: [sber_b1flip__impulse_6_3]
      moex: [moex_b1flip__impulse_6_3]
      mtss: [mtss_b1flip__impulse_6_3]
      eth: [eth_b1flip__impulse_6_3]
  - id: S11
    family: strategy
    title: Узкий стоп и трейлинг 3 ATR
    change: стоп и трейлинг 3 ATR вместо 6 (трейлинг включается после +1.5 ATR), выход ≤ 240 ч
    exit: {sl: 3, trail: 3, act: 1.5, hours: 240}
    baseline: B01
    verdict: "хуже базы"
