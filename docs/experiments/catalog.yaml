# Каталог экспериментов: из него scripts/experiments.py строит журнал (registry.csv, карточки, страницу).
#
# Новый эксперимент — новая запись: id, семейство, что поменяли, с чем сравниваем (baseline), откуда
# сделки (sources: инструмент -> список прогонов в reports/walk_forward/<имя>_trades.csv; несколько
# прогонов, например seed модели, усредняются), издержки (costs: профиль брокера пересчитывается по
# сделкам), вердикт и ссылка на подробности. Метрики не пишутся руками — их считает скрипт по одному
# протоколу: проверка — сделки, открытые с 1 января 2021 года.

families:
  strategy: стратегия без ML (импульс)
  model: модель CatBoost

# Выход по умолчанию — для линий стопа и трейлинга на графике сделок (в ATR на входе): стоп sl, трейлинг
# trail от лучшей цены, включается после хода act; не дольше hours часов. У эксперимента — поле exit.
exit_defaults:
  strategy:
    all: {sl: 6, trail: 6, act: 3, hours: 240}
  model:
    silver: {sl: 2, trail: 1.5, act: 1, hours: 10}
    lkoh: {sl: 1, trail: 1.5, act: 1, hours: 10}

experiments:
  # ---------------- импульсная стратегия ----------------
  - id: S01
    family: strategy
    title: Импульс, базовая версия
    change: ход за 6 ч ≥ 3 ATR по тренд-гейту C; стоп и трейлинг 6 ATR (активация +3), выход ≤ 240 ч; комиссия 0.04%, стоп исполняется по уровню
    hypothesis: H24
    baseline: null
    verdict: база
    doc: results/impulse_instruments.md
    sources: &s01
      silver: [silver_exit_240h6__impulse_6_3]
      gold: [gold_exit_240h6__impulse_6_3]
      lkoh: [lkoh_exit_240h6__impulse_6_3]
      gazp: [gazp_exit_240h6__impulse_6_3]
      sber: [sber_exit_240h6__impulse_6_3]
      moex: [moex_exit_240h6__impulse_6_3]
      mtss: [mtss_exit_240h6__impulse_6_3]
      eth: [eth_exit_240h6__impulse_6_3]
  - id: S02
    family: strategy
    title: Стоп исполняется по цене открытия при гэпе
    change: если минута открылась уже за стопом (ночь, выходные), выход по её цене открытия, а не по уровню стопа
    baseline: S01
    verdict: учтено (поправка −9 п.п.)
    doc: results/audit.md
    sources:
      silver: [silver_robust__impulse_6_3]
      lkoh: [lkoh_robust__impulse_6_3]
      gazp: [gazp_robust__impulse_6_3]
      sber: [sber_robust__impulse_6_3]
  - id: S03
    family: strategy
    title: Цены акций скорректированы на дивиденды
    change: обратная корректировка цен акций на 66 отсечек 2015–2026; стоп по гэпу
    hypothesis: H01
    baseline: S02
    verdict: учтено (подтвердилась)
    doc: results/costs.md
    dividends: true
    sources: &s03
      silver: [silver_costs__impulse_6_3_h240_tr6]
      gold: [gold_costs__impulse_6_3_h240_tr6]
      lkoh: [lkoh_costs__impulse_6_3_h240_tr6]
      gazp: [gazp_costs__impulse_6_3_h240_tr6]
      sber: [sber_costs__impulse_6_3_h240_tr6]
      moex: [moex_costs__impulse_6_3_h240_tr6]
      mtss: [mtss_costs__impulse_6_3_h240_tr6]
      eth: [eth_costs__impulse_6_3_h240_tr6]
  - id: S04
    family: strategy
    title: Проскальзывание 0.05% на входе и выходе
    change: исполнение хуже на 0.05% цены при входе и при выходе — по сделкам S03 (0.1% — перебор, договорённость 11.10)
    baseline: S03
    verdict: учтено в базе
    doc: results/audit.md
    dividends: true
    costs: {profile: base, set: {swap_long_pct: 0, swap_short_pct: 0}}
    sources: *s03
  - id: B01
    family: strategy
    title: База — все неизбежные издержки
    change: S03 (дивиденды, стоп по гэпу, комиссия 0.04%) + проскальзывание 0.05% на сторону + свопы за перенос по условиям Альфа-Форекс (серебро с шагом 0.001); с ней сравниваются все эксперименты
    hypothesis: H02
    baseline: S04
    verdict: база
    doc: results/costs.md
    dividends: true
    costs: &base_costs {profile: base}
    sources: *s03
  - id: S05
    family: strategy
    title: Проскальзывание 0.1% вместо 0.05%
    change: исполнение хуже на 0.1% цены на входе и на выходе — запас прочности базы
    baseline: B01
    verdict: "запаса нет: портфель в минусе, металлы +16%"
    doc: results/audit.md
    dividends: true
    costs: {profile: base, set: {slippage_pct: 0.1}}
    sources: *s03
  - id: S06
    family: strategy
    title: Проскальзывание 0.15% вместо 0.05%
    change: ""
    baseline: B01
    verdict: "убыточно (безубыток металлов ≈ 0.13%)"
    doc: results/audit.md
    dividends: true
    costs: {profile: base, set: {slippage_pct: 0.15}}
    sources: *s03
  - id: S07
    family: strategy
    title: Проскальзывание 0.2% вместо 0.05%
    change: ""
    baseline: B01
    verdict: "убыточно"
    doc: results/audit.md
    dividends: true
    costs: {profile: base, set: {slippage_pct: 0.2}}
    sources: *s03
  - id: S08
    family: strategy
    title: Проскальзывание 0.3% вместо 0.05%
    change: ""
    baseline: B01
    verdict: "убыточно"
    doc: results/audit.md
    dividends: true
    costs: {profile: base, set: {slippage_pct: 0.3}}
    sources: *s03
  - id: S10
    family: strategy
    title: Выход при развороте тренд-фильтра
    change: сделка закрывается, когда гейт C разворачивается против неё
