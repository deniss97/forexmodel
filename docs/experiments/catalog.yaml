      silver: [silver_vol_s42__cb, silver_vol_s7__cb, silver_vol_s1__cb]
  - id: M10
    family: model
    title: Размер позиции пропорционален ATR
    change: размер = ATR / медиана ATR (меньше в спокойном рынке)
