  - id: S17
    family: strategy
    title: Издержки Альфа-Форекс (CFD), серебро с шагом 0.001
    change: спред брокера вместо комиссии и проскальзывания (свопы те же, что в базе; условия на 06.10.2026)
    hypothesis: H02
