  # ---------------- модель CatBoost: серебро ----------------
  - id: M01
    family: model
    title: CatBoost серебра, базовая (3 seed)
    change: 81 признак, разметка на 3 класса (+1.5 ATR раньше −0.75 ATR за 10 ч и наоборот), сделки по тренд-фильтру; годовой walk-forward 2019–2026
    hypothesis: H20
    baseline: null
    verdict: база (преимущество ≈ комиссии)
    doc: results/model_changelog.md
    sources:
      silver: [silver_base, silver_base_s7, silver_base_s1]
  - id: M02
    family: model
    title: Обучение только внутри тренд-гейта
    change: модель учится только на барах, где гейт разрешает вход
    baseline: M01
    verdict: на проверке 2021–26 лучше базы (t 1.8 против 1.2), но базы разных прогонов (M01 и M09) расходятся так же — перепроверить
    doc: results/model_changelog.md
    sources:
      silver: [silver_base_gateonly, silver_base_gateonly_s1, silver_base_gateonly_s2, silver_base_gateonly_s7]
  - id: M03
    family: model
    title: Разметка по направлению (h4 / 0.3 ATR)
    change: класс — знак хода за 4 часа, если он больше 0.3 ATR
    baseline: M01
    verdict: не помогло
    doc: results/model_improvements.md
    sources:
      silver: [silver_h4_d030]
  - id: M04
    family: model
    title: Регрессия величины хода вместо классов
    change: модель предсказывает ход в ATR через 4 часа
    baseline: M01
    verdict: не помогло
    doc: results/model_changelog.md
    sources:
      silver: [silver_reg_h4]
  - id: M05
    family: model
    title: Сильнее регуляризованная модель
    change: lr 0.02, глубина 4, l2 10, до 3000 деревьев
    baseline: M01
    verdict: стабильнее, но хуже
    doc: results/model_changelog.md
    sources:
      silver: [silver_reg_s42, silver_reg_s7, silver_reg_s1]
  - id: M06
    family: model
    title: Ансамбль 3 моделей с разными seed
    change: вероятности трёх моделей усредняются
    baseline: M01
    verdict: не помогло
    doc: results/model_changelog.md
    sources:
      silver: [silver_ens3_s42, silver_ens3_s7, silver_ens3_s1]
  - id: M07
    family: model
    title: CatBoost (прогон для мета-модели, seed 42)
    change: тот же прогон без мета-фильтра — база для M08
    baseline: null
    verdict: база
    doc: results/model_changelog.md
    sources:
      silver: [silver_metactx_s42__cb]
  - id: M08
    family: model
    title: Мета-модель с контекстом, порог 0.50
    change: вторая модель решает, брать ли сделку (контекст, класс входа, недавние сделки)
    baseline: M07
    verdict: не помогло (AUC ≈ 0.5)
