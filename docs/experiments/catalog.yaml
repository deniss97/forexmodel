      sber: [sber_costs__impulse_6_3_h240_tr3]
      moex: [moex_costs__impulse_6_3_h240_tr3]
      mtss: [mtss_costs__impulse_6_3_h240_tr3]
      eth: [eth_costs__impulse_6_3_h240_tr3]
  - id: S12
    family: strategy
    title: Выход не позже 120 ч (стоп 6, трейлинг 6, активация 3)
    change: удержание вдвое короче — меньше свопов
    hypothesis: H03
