  - {title: "23 паттерна цены на удержании 10 ч и 2–5 дней", result: "на 10 ч ни один не окупает комиссию; на 2–5 днях импульс продолжается (z до 3.2)", doc: results/patterns.md}
  - {title: "Модель CatBoost на паттерн («брать ли сделку импульса»)", result: "разница с «без модели» около нуля", doc: results/patterns.md}
  - {title: "Признак бокового рынка", result: "ни один признак не разделяет годы одинаково в обоих периодах", doc: results/patterns.md}
  - {title: "Ранний вход на 15 и 30 минутах", result: "золото лучше, серебро и LKOH хуже", doc: results/patterns.md}
  - {title: "Диффузионная модель TokDiT как фильтр импульса", result: "серебро +68% → +17%", doc: results/patterns.md}
  - {title: "Сетка выхода быстрым движком (48–720 ч × 3–8 ATR)", result: "плато 168–240 ч, трейлинг 6 ATR", doc: results/patterns.md}
  - {title: "Порог импульса в %, меньший порог, серая зона EMA5", result: "3 ATR лучше всех; серая зона на входы не влияет", doc: results/impulse_instruments.md}
  - {title: "Перенос стопа в безубыток после +2…4 ATR", result: "+144% → +112…129% на 8 инструментах", doc: results/impulse_instruments.md}
