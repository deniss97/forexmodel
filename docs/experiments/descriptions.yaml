# Описания экспериментов для журнала: что конкретно проверяли, зачем и итог простыми словами.
# Ключ — id из catalog.yaml. Цифры метрик здесь не пишутся — их считает scripts/experiments.py.

S01:
  what: "Каждый час проверяем, прошла ли цена за последние 6 часов не меньше 3 ATR (ATR — средний размах часовой свечи за 14 часов). Если направление хода совпадает с тренд-гейтом C (4-часовой тренд, пересчёт каждый час, удержание 2 часа), входим в ту же сторону через минуту после закрытия часа по цене открытия. Стоп — 6 ATR от входа; когда сделка дала +3 ATR, стоп подтягивается и держится в 6 ATR от лучшей цены. Выход по стопу или через 240 часов. Одна позиция на инструмент. Комиссия 0.04% за сделку, стоп исполняется ровно по своему уровню."
  why: "Лаборатория паттернов показала, что после сильного движения цена продолжает идти в ту же сторону 2–5 дней сверх обычного дрейфа."
  outcome: "Первая версия стратегии, прибыльная на большинстве рынков; от неё отсчитываются все следующие проверки."
S02:
  what: "Та же стратегия, но если минута, на которой сработал стоп, открылась уже за уровнем стопа (ночной гэп, выходные, дивидендная отсечка), выход считается по цене открытия этой минуты, а не по уровню стопа."
  why: "Движок был оптимистичен — исполнял стоп по уровню даже тогда, когда цена его «перепрыгнула». В реальности брокер исполнит по первой доступной цене."
  outcome: "Акции теряют 10–14 п.п. за весь период, серебро почти не меняется. Поправка учтена во всех следующих расчётах."
S03:
  what: "Цены акций обратно скорректированы на 66 дивидендных отсечек 2015–2026 — все цены до отсечки умножены на (цена − дивиденд) / цена. Гэп отсечки исчезает и не создаёт ложного импульса вниз, а позиция через отсечку получает полную доходность — лонг дивиденд получает, шорт платит. Стоп по гэпу. Металлы и эфир не меняются."
  why: "В нескорректированных ценах шорт, державший позицию через отсечку, «зарабатывал» дивидендный гэп, хотя в реальности дивиденд пришлось бы заплатить."
  outcome: "Газпром и Лукойл заметно ниже, Сбербанк чуть выше (там через отсечку чаще держали лонги). Портфель теряет около 17 п.п. за весь период."
S04:
  what: "Цена исполнения хуже на 0.05% при входе и при выходе по стопу или трейлингу (выход по времени — по цене закрытия). Стоп по гэпу, без дивидендной корректировки."
  why: "Узнать, сколько проскальзывания выдерживает стратегия."
  outcome: "Небольшая потеря, значимость сохраняется."
S05:
  what: "Проскальзывание 0.1% на входе и 0.1% на выходе по стопу или трейлингу. Стоп по гэпу."
  why: "Реалистичная оценка издержек исполнения сверх комиссии."
  outcome: "Стратегия остаётся в плюсе и значимой на серебре, акции на грани. Это рабочий порог — дороже исполнять уже рискованно."
S06:
  what: "Проскальзывание 0.15% на входе и на выходе по стопу."
  why: "Где начинается граница."
  outcome: "Плюс сохраняется, но акции уже на грани шума; держится в основном серебро."
S07:
  what: "Проскальзывание 0.2% на входе и на выходе по стопу."
  why: "Где начинается граница."
  outcome: "Итог почти исчезает, значимости нет."
S08:
  what: "Проскальзывание 0.3% на входе и на выходе по стопу."
  why: "Найти точку безубытка."
  outcome: "Убыток. Безубыток — около 0.25% на сторону."
S09:
  what: "Проскальзывание 0.1% только на входе, стоп по уровню — первая проверка издержек (28.09), на всех 8 рынках."
  why: "Пережить реальные издержки входа."
  outcome: "Серебро и акции устойчивы, золото падает почти до нуля."
S10:
  what: "К базе добавлен выход по развороту тренда — сделка закрывается по закрытию часа, когда гейт C становится противоположным её направлению. Тренд берётся только по закрытой свече (без заглядывания)."
  why: "Держать позицию, пока тренд не развернулся, и не отдавать прибыль обратно."
  outcome: "Сделок больше и они короче, но срезаются крупные движения, ради которых стратегия держит позицию. Итог ниже."
S11:
  what: "Стоп и трейлинг 3 ATR вместо 6 (трейлинг включается после +1.5 ATR), выход по-прежнему не позже 240 часов. Серебро, золото, Лукойл."
  why: "Ближний стоп — меньше убыток на сделку."
  outcome: "Итог заметно ниже, и при 0.1% проскальзывания стратегия почти обнуляется — узкий стоп выбивает рынок обычным шумом."
S12:
  what: "Выход не позже 120 часов, стоп 6 ATR, трейлинг 6 ATR после +3 ATR — первая версия стратегии в общем пайплайне (28.09). Серебро, золото, Лукойл."
  why: "Удержание 2–5 дней, на котором лаборатория нашла эффект."
  outcome: "Прибыльна, но заметно слабее 240 часов — отсюда выбран выход 240 ч."
S13:
  what: "Выход не позже 48 часов, стоп и трейлинг 4 ATR (трейлинг после +2 ATR). Серебро, золото, Лукойл."
  why: "Короткое удержание — меньше риск и больше сделок."
  outcome: "Хуже 120 и 240 часов: импульс отрабатывает за несколько дней, короткий выход забирает лишь начало хода."
S14:
  what: "Выход 120 часов; вход по любому импульсу 6 ч / 3 ATR в его сторону, без проверки тренд-гейта."
  why: "Нужен ли тренд-фильтр вообще."
  outcome: "На этих трёх рынках без фильтра хуже. Позже на 8 рынках и 300 случайных фильтрах выяснилось, что в среднем фильтр почти ничего не добавляет, а гейт C — удачный вариант."
S15:
  what: "Выход 120 часов; входить, только если ATR сигнального часа не ниже медианы ATR обучающего периода."
  why: "Преимущество должно быть больше в активном рынке."
  outcome: "Сделок вдвое меньше; на одних рынках сделка лучше, на других хуже — правило не универсально."
S16:
  what: "Выход 120 часов; импульс — ход за 8 часов не меньше 3.5 ATR (вместо 6 часов и 3 ATR)."
  why: "Более длинное и сильное движение может лучше продолжаться."
  outcome: "Сделок меньше, итог ниже. Сетка «окно × порог» гладкая, 6 ч / 3 ATR остаётся."
S17:
  what: "Сделки S03, но издержки брокера Альфа-Форекс вместо комиссии 0.04% — спред (серебро 90 пунктов ≈ 0.12% при шаге цены 0.001, акции 0.15%, эфир 0.09%, золото 0.01%) и своп за каждый перенос позиции через ночь (серебро лонг −0.073%, шорт −0.020%; акции −0.068% в обе стороны; эфир −0.042%; золото лонг −0.011%, шорт 0). Выходные — тройной перенос в день, назначенный брокером. Сегодняшние условия применены ко всей истории."
  why: "Длинное удержание — это много переносов, а перенос у брокера стоит денег."
  outcome: "Акции уходят в минус — около 6 переносов на сделку по 0.068% плюс спред съедают доход. Серебро остаётся в слабом плюсе."
S18:
  what: "То же, если серебро у брокера котируется с 4 знаками (1 пункт = 0.0001) — спред ≈ 0.012%, свопы в 10 раз меньше."
  why: "Размер пункта серебра на сайте брокера не указан — посчитали оба варианта."
  outcome: "Серебро сохраняет результат целиком; портфель в слабом плюсе из-за акций."
S19:
  what: "Условия Альфа-Форекс, но выход не позже 168 часов, стоп и трейлинг 4 ATR (трейлинг после +2 ATR). Сделки заново посчитаны штатным симулятором с дивидендами и стопом по гэпу."
  why: "Короче удержание — меньше переносов и свопов. Это лучший по профит-фактору вариант сетки на 2016–2020."
  outcome: "Около нуля — экономия на свопах меньше потери сигнала."
S20:
  what: "Условия Альфа-Форекс, выход не позже 120 часов, стоп и трейлинг 6 ATR."
  why: "Короче удержание при том же стопе."
  outcome: "Убыток."
S21:
  what: "Условия Альфа-Форекс, выход не позже 72 часов, стоп и трейлинг 3 ATR."
  why: "Ещё короче удержание."
  outcome: "Около нуля — короткая сделка забирает лишь начало хода."
S22:
  what: "Выход 168 часов, стоп и трейлинг 4 ATR при прежней комиссии 0.04% без свопов (с дивидендами и стопом по гэпу)."
  why: "Отделить эффект выхода от эффекта свопов — сравнить с S19."
  outcome: "Чуть хуже базового выхода 240 ч / 6 ATR — без свопов короткий выход не нужен."
M01:
  what: "Модель CatBoost (градиентный бустинг деревьев решений) по 81 признаку часовых баров серебра. Разметка на 3 класса — «рост», если цена прошла +1.5 ATR раньше −0.75 ATR в следующие 10 часов, «падение» — наоборот, иначе «ничего». Каждый год модель учится на данных до 1 января (часть последних данных — для ранней остановки) и торгует весь год. Сделка открывается, если ожидаемая выгода по вероятности класса с учётом комиссии положительна и направление совпадает с тренд-гейтом; стоп 2 ATR, трейлинг 1.5 ATR после +1 ATR, выход через 10 часов. Три прогона с разными seed, метрики усреднены."
  why: "Базовая постановка проекта — прогноз ближайшего движения."
  outcome: "Средняя сделка после комиссии едва выше нуля — преимущество модели равно комиссии."
M02:
  what: "Та же модель, но обучающая выборка — только часы, где гейт C разрешает вход; остальные часы (около двух третей) из обучения убраны. Торговля та же. Четыре прогона с разными seed."
  why: "Модель тратила силы на нейтральные часы, где сделок всё равно не бывает."
  outcome: "На проверке 2021–2026 лучше базы, но разница сравнима с разбросом между базовыми прогонами — перепроверяем (гипотеза H31)."
M03:
  what: "Вместо трёх классов по барьерам — класс по знаку хода за 4 часа, если ход больше 0.3 ATR, иначе «ничего». Остальное как в базе. Один прогон."
  why: "Барьеры могли учить модель волатильности, а не направлению."
  outcome: "Хуже базы — модель всё равно опирается на волатильность, прибыльна в 3 годах из 8."
M04:
  what: "Регрессия — модель предсказывает величину хода через 4 часа в ATR; сделка, если прогноз больше 0.3 ATR в одну из сторон."
  why: "Спросить модель напрямую «куда и на сколько»."
  outcome: "Ранняя остановка оставляет 1–4 дерева, прогноз почти никогда не выходит за порог — сигнала нет, сделок единицы."
M05:
  what: "Те же признаки и разметка, но более осторожное обучение — шаг 0.02, глубина деревьев 4, регуляризация L2 10, терпение ранней остановки 300, до 3000 деревьев. Три seed."
  why: "С обычными настройками модель останавливалась на 20–240 деревьях и сильно зависела от seed."
  outcome: "Стабильнее между seed, но не лучше базы."
M06:
  what: "Три модели с разными seed обучаются на одном окне, их вероятности усредняются. Три таких ансамбля."
  why: "Усреднение должно погасить случайность одной модели."
  outcome: "Разброс результатов не уменьшился — он идёт от последовательности сделок (одна сдвинутая сделка меняет все следующие), а не от модели."
M07:
  what: "Один прогон (seed 42), в котором дополнительно обучалась мета-модель; здесь — сделки основной модели без мета-фильтра."
  why: "База для M08 — тот же прогон, чтобы сравнивать только эффект мета-модели."
  outcome: "База."
M08:
  what: "Вторая модель (мета-модель) решает, брать ли сделку основной модели. Её признаки — ход и свеча относительно стороны сделки, класс входа (продолжение, плоско, откат, «нож»), результаты последних 10 и 30 сделок, режим рынка. Сделка — если вероятность успеха не ниже 0.50."
  why: "Отсеять плохие сделки основной модели по контексту, которого у неё нет."
  outcome: "AUC мета-модели 0.47–0.53 во всех годах — она не отличает удачные сделки от неудачных; итог как у базы."
M09:
  what: "Прогон с обученной моделью волатильности (3 seed); здесь — сделки основной модели с размером позиции 1."
  why: "База для M10–M12 — те же сделки, меняется только размер позиции."
  outcome: "База."
M10:
  what: "Размер позиции = ATR сигнального часа / медиана ATR обучающего периода (не больше 2). Комиссия масштабируется размером. Сделки те же, что в M09."
  why: "Преимущество в процентах растёт с волатильностью, а комиссия — нет; значит, в активном рынке стоит торговать больше."
  outcome: "t и профит-фактор лучше базы на всех seed — единственное устойчивое улучшение модели. Итог в процентах выше и за счёт большего среднего размера позиции."
M11:
  what: "Торговать только если ATR сигнального часа не ниже медианы обучающего периода; размер 1."
  why: "Тот же эффект, но без увеличения позиции."
  outcome: "Сделок меньше, ожидание на сделку выше вдвое; t выше базы."
M12:
  what: "Размер позиции по прогнозу волатильности отдельной моделью CatBoost (средний размах на 10 часов вперёд) вместо текущего ATR."
  why: "Прогноз волатильности точнее текущего ATR."
  outcome: "Прогноз действительно точнее (корреляция с фактом 0.76 против 0.40), но для размера хуже наивного ATR — модель ловит час суток, а преимущество связано с уровнем волатильности периода."
M13:
  what: "Прогон вариантов тренд-гейта (3 seed); здесь — сделки основной модели с гейтом C."
  why: "База для M14–M17 — та же модель, меняется только правило входа или признаки."
  outcome: "База."
M14:
  what: "Гейт входа — гейт C со сбросом по EMA5 4-часовых свечей — тренд не считается «вверх», пока 4-часовая свеча закрывается ниже EMA5 (и наоборот). Идея из ноутбука S_TrendFiter."
  why: "Убрать входы в «слабой зоне» тренда, которые видны на графике."
  outcome: "Сделок меньше, результат сделки тот же, итог ниже."
M15:
  what: "То же со сбросом по EMA5 часовых свечей."
  why: "Более быстрый сброс."
  outcome: "Сделок вдвое меньше, итог ниже — нарушения по часовой EMA5 обычно просто откаты внутри тренда."
M16:
  what: "Гейт входа — набор параметров тренд-фильтра «плато» из нового подбора (подтверждение 6 часов, гистерезис, шок-слой, сброс по EMA13), лучший по следованию тренду."
  why: "Лучшая разметка тренда должна давать лучшие входы."
  outcome: "Как метка тренда он лучше, как фильтр входа — модель уходит в ноль. Подбирать фильтр нужно под применение."
M17:
  what: "В модель добавлены признаки «слабой зоны» — расстояние до EMA5 часа и 4 часов в ATR и сторона закрытия относительно EMA5 по направлению гейта."
  why: "Пусть модель сама решит, когда слабая зона важна."
  outcome: "Хуже базы на всех seed; признаки почти не используются (около 1% прогноза)."
L01:
  what: "CatBoost Лукойла — 85 признаков, включая 4 по объёму, та же разметка на 3 класса; квартальный walk-forward 2024Q3–2026Q1 без тренд-фильтра; 3 seed. Период короче, чем у серебра, — лента сделок есть только с 2024 года."
  why: "База для проверки признаков ленты обезличенных сделок."
  outcome: "После комиссии в минусе на всех seed."
L02:
  what: "К признакам добавлена лента обезличенных сделок ALGOPACK — дельта агрессора (покупки минус продажи) за час и окна, нетто-дельта крупных сделок, профиль объёма (уровень максимального объёма и зона стоимости)."
  why: "Лента — информация, которой нет в ценах; лучший одиночный признак проекта был из неё."
  outcome: "Хуже базы — внутри модели признаки ленты не помогают."
L03:
  what: "Лента плюс обучение на всей истории с 2016 года (где ленты нет — пропуски)."
  why: "Больше данных для обучения."
  outcome: "На уровне базы."
L04:
  what: "Без модели — лонг, если z-оценка нетто-дельты крупных сделок за 6 часов не ниже 1.5; шорт, если не выше −1.5."
  why: "Этот признак дал +8.6% на 258 сделках во втором полугодии 2025 года."
  outcome: "На 9 кварталах −17% — прежний результат был удачным полугодием."
L05:
  what: "Прогон с моделью волатильности (3 seed); здесь — сделки основной модели Лукойла с размером 1."
  why: "База для L06."
  outcome: "База."
L06:
  what: "Торговать только если ATR сигнального часа не ниже медианы обучающего периода."
  why: "Проверить на втором инструменте эффект, найденный на серебре (M11)."
  outcome: "Из минуса около нуля на всех seed — направление эффекта то же, что у серебра, но преимущества нет."
L07:
  what: "Годовой walk-forward Лукойла 2018–2026 с гейтом C, один прогон."
  why: "Длинная история для модели Лукойла."
  outcome: "В 2021 и 2024 модель вырождается в 1–7 деревьев и почти не торгует; в целом около нуля."
L08:
