S50:
  what: "GAZP, SBER, LKOH на бирже в лонг, пока трёхслойный фильтр не покажет вниз: нейтраль позицию не закрывает. Вход и выход по открытию часа после сигнала, без стопа и подбора; цены с поправкой на дивиденды, издержки биржи."
  why: "В разборе H59 этот вариант дал плюс на всех трёх бумагах в обоих периодах; надо было понять, не просто ли это рост рынка, и годится ли он второй стратегией к импульсу (гипотеза H60)."
  outcome: "Против «купить и держать» — лучше на единицу риска в обоих периодах: просадка вдвое меньше, t месяцев выше; на выборе итог ниже держания. Но месяцы правила и акций S42 сильно связаны (обе держат те же бумаги в лонг), и портфель с ними на проверке не лучше. Сравнение с держанием — в docs/results/trend_hold.md."
M19:
  what: "Сделки модели CatBoost на серебре (M13, 3 seed) без изменений; берётся только сделка по направлению трёхслойного фильтра на последнем закрытом часе до входа: лонг — фильтр вверх, шорт — вниз."
  why: "Созвон 18.10: находки по тренд-фильтру применить к текущей модели — брать её сделки только по направлению лучшего фильтра (гипотеза H58)."
  outcome: "Фильтр улучшает модель в обоих периодах, но она остаётся в минусе: остаётся около 60% сделок."
L09:
  what: "Сделки модели CatBoost на LKOH (L07) без изменений; берётся только сделка по направлению трёхслойного фильтра на последнем закрытом часе до входа."
  why: "Созвон 18.10: тренд-фильтр к текущей модели (гипотеза H58), вторая модель."
  outcome: "Как и на серебре: лучше в обоих периодах, но в минусе."
S51:
  what: "Импульс S42 без изменений — правило, выход, гейт C, только лонг, издержки биржи, цены с поправкой на дивиденды — на 16 акциях индекса Мосбиржи, которые не участвовали в выборе: TATN, NVTK, GMKN, ROSN, VTBR, PLZL, SNGSP, IRAO, CHMF, NLMK, MAGN, RTKM, TRNFP, AFLT, ALRS, AFKS. Бумаги отобраны до расчёта: история с 2015 года, оборот 2016–2020 от 100 млн ₽ в день, одна бумага на эмитента."
  why: "Созвон 23.10: много стратегий на многих инструментах; S42 выбран на SBER, GAZP, LKOH — новые бумаги проверяют, не подгонка ли это под них (гипотеза H66, T41)."
  outcome: "Преимущество переносится, но слабым: PF 1.28 на выборе и 1.08 на проверке, в плюсе 12 бумаг из 16, средняя сделка заметно лучше случайных входов в лонг той же длины (p 0.001). Порог H66 (PF > 1.1 на проверке) не пройден. На бумагах выбора PF 1.37 — часть результата S42 дал удачный выбор бумаг."
S52:
  what: "Стратегия итератора S45 (NR7 → пробой, ADX 1ч > 25, выход Дончиан 20 дней, стоп 6 ATR, размер по риску) без изменений на тех же 16 новых акциях, движком перебора; только лонг, издержки биржи."
  why: "Гипотеза H66: финалисты итератора выбраны на наборе для запуска — проверка на бумагах, которых перебор не видел."
  outcome: "Не переносится: PF 1.42 на выборе, 1.03 на проверке, без 2 лучших в минусе, от случайных входов не отличается. Как и на журнале (S45), это подгонка."
S53:
  what: "Стратегия итератора S46 (пробой 55 дней, EMA200 4ч и ATR14/ATR100 > 1, выход Supertrend 4ч, стоп 3 ATR, размер по риску) без изменений на 16 новых акциях, движком перебора; только лонг, издержки биржи."
  why: "Гипотеза H66: S46 — единственный финалист, что держался на проверке (кандидат в бумажный режим) — держится ли он на бумагах, которых перебор не видел."
  outcome: "Подтвердилась по критерию H66: PF 1.44 на выборе и 1.30 на проверке, без 2 лучших в плюсе, в плюсе 12 бумаг из 16, лучше случайных входов (p 0.02). Вдвое слабее, чем на SBER, GAZP, LKOH (PF 2.60)."
S54:
  what: "Стратегия итератора S47 (канал Кельтнера на дневках, фильтр EMA200 дней, выход по обратному сигналу, стоп 6 ATR) без изменений на 16 новых акциях, движком перебора; только лонг, издержки биржи."
  why: "Гипотеза H66: проверка финалистов итератора на бумагах, которых перебор не видел."
  outcome: "Не переносится: PF 1.42 на выборе, 1.07 на проверке, без 2 лучших в минусе, от случайных входов не отличается (p 0.26)."
S55:
  what: "Стратегия итератора S48 (пробой 20 дней + 0.25 ATR, фильтр EMA200 дней, выход Дончиан 20 дней, стоп 3 ATR, размер 1) без изменений на 16 новых акциях, движком перебора; только лонг, издержки биржи."
  why: "Гипотеза H66: проверка финалистов итератора на бумагах, которых перебор не видел."
  outcome: "Подтвердилась по критерию H66: PF 1.34 на выборе и 1.21 на проверке, без 2 лучших в плюсе, в плюсе 9 бумаг из 16, лучше случайных входов (p 0.003)."
S56:
  what: "Правило H60 без изменений — лонг, пока трёхслойный фильтр (режим по дневной EMA200) не покажет вниз, нейтраль позицию не закрывает; вход и выход по открытию часа после сигнала, без стопа — на 16 новых акциях; издержки биржи."
  why: "Гипотеза H66: на SBER, GAZP, LKOH правило было лучше «купить и держать» на единицу риска (H60) — так ли на бумагах, которых не видели."
  outcome: "На проверке лучше держания: +31% при просадке −26% против −4% и −55%, лучше на 11 бумагах из 16. На выборе 2016–2020 (растущий рынок) хуже: +71% / −14% против +200% / −32%, лучше только на 5 бумагах. Правило уводит от падений, но в росте отстаёт — по критерию H66 не подтвердилось."
S57:
  what: "Импульс S42 без изменений по серебру и золоту в обе стороны, но вместо спот-цен под CFD — фьючерсы Мосбиржи SILV и GOLD: ближний контракт, переход за 5 дней до экспирации, прошлое поправлено на разрыв при переходе. Издержки биржи: 0.04% комиссии и 0.05% проскальзывания на сторону, свопов нет."
  why: "Запуск через Т-Инвестиции: металлы там — только фьючерсы, зато в обе стороны и без свопов, которые съедают серебро у CFD-брокера (T01). Гипотеза H68."
  outcome: "Слабее CFD: PF 1.05 на выборе и на проверке, итог без 2 лучших в минусе. На ценах CFD с теми же издержками без свопов правило дало бы PF 1.34 на проверке — дело в инструменте: совпадает только 60% входов, ночные движения металлов на фьючерсе приходят гэпом."
S58:
  what: "Стратегия итератора S46 (пробой 55 дней) без изменений на склейке фьючерсов Мосбиржи SILV и GOLD, обе стороны, издержки биржи без свопов."
  why: "Гипотеза H68 — для портфеля: годятся ли фьючерсы на металлы второй стратегией."
  outcome: "В минусе на проверке (PF 0.88 при 2.38 на выборе); на CFD по металлам S46 тоже в минусе (0.78)."
S59:
  what: "Стратегия итератора S48 (пробой 20 дней + 0.25 ATR) без изменений на склейке фьючерсов Мосбиржи SILV и GOLD, обе стороны, издержки биржи без свопов."
  why: "Гипотеза H68 — для портфеля."
  outcome: "В минусе на проверке (PF 0.73 при 1.36 на выборе); на CFD по металлам S48 тоже в минусе (0.85)."
