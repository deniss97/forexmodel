# Описания экспериментов для журнала: что конкретно проверяли, зачем и итог простыми словами.
# Ключ — id из catalog.yaml. Цифры метрик здесь не пишутся — их считает scripts/experiments.py.

S01:
  what: "Каждый час проверяем, прошла ли цена за последние 6 часов не меньше 3 ATR (ATR — средний размах часовой свечи за 14 часов). Если направление хода совпадает с тренд-гейтом C (4-часовой тренд, пересчёт каждый час, удержание 2 часа), входим в ту же сторону через минуту после закрытия часа по цене открытия. Стоп — 6 ATR от входа; когда сделка дала +3 ATR, стоп подтягивается и держится в 6 ATR от лучшей цены. Выход по стопу или через 240 часов. Одна позиция на инструмент. Комиссия 0.04% за сделку, стоп исполняется ровно по своему уровню."
  why: "Лаборатория паттернов показала, что после сильного движения цена продолжает идти в ту же сторону 2–5 дней сверх обычного дрейфа."
  outcome: "Первая версия стратегии, прибыльная на большинстве рынков; от неё отсчитываются все следующие проверки."
S02:
  what: "Та же стратегия, но если минута, на которой сработал стоп, открылась уже за уровнем стопа (ночной гэп, выходные, дивидендная отсечка), выход считается по цене открытия этой минуты, а не по уровню стопа."
  why: "Движок был оптимистичен — исполнял стоп по уровню даже тогда, когда цена его «перепрыгнула». В реальности брокер исполнит по первой доступной цене."
  outcome: "Акции теряют 10–14 п.п. за весь период, серебро почти не меняется. Поправка учтена во всех следующих расчётах."
S03:
  what: "Цены акций обратно скорректированы на 66 дивидендных отсечек 2015–2026 — все цены до отсечки умножены на (цена − дивиденд) / цена. Гэп отсечки исчезает и не создаёт ложного импульса вниз, а позиция через отсечку получает полную доходность — лонг дивиденд получает, шорт платит. Стоп по гэпу. Металлы и эфир не меняются."
  why: "В нескорректированных ценах шорт, державший позицию через отсечку, «зарабатывал» дивидендный гэп, хотя в реальности дивиденд пришлось бы заплатить."
  outcome: "Газпром и Лукойл заметно ниже, Сбербанк чуть выше (там через отсечку чаще держали лонги). Портфель теряет около 17 п.п. за весь период."
S04:
  what: "Сделки S03, но исполнение хуже на 0.05% цены при входе и при любом выходе — по стопу, трейлингу и по времени. Считается по готовым сделкам: из результата каждой вычитается 0.1%."
  why: "Вход в следующую минуту после сигнала частично уже несёт проскальзывание, но, чтобы не обманывать себя, 0.05% на сторону закладываем всегда (0.1% — перебор, договорённость 11.10)."
  outcome: "Небольшая потеря, значимость сохраняется. Это поправка, а не эксперимент — она входит в базу B01."
B01:
  what: "База для всех сравнений: сделки S03 (цены акций скорректированы на дивиденды, стоп исполняется по гэпу, комиссия 0.04%) плюс проскальзывание 0.05% на сторону и своп за каждый перенос позиции через ночь по условиям Альфа-Форекс на 06.10.2026: акции −0.068% в обе стороны, серебро лонг −0.073% и шорт −0.020% (шаг цены 0.001), золото лонг −0.011%, эфир −0.042%. Выходные — тройной перенос."
  why: "Доработки нужно сравнивать с версией, где учтено всё, без чего результат завышен, — иначе «улучшение» может оказаться непосчитанной издержкой. Сделка держится в среднем около 5 дней, это 5–6 переносов."
  outcome: "Портфель 4 около нуля на проверке и в минусе на выборе: свопы акций съедают весь доход. В плюсе остаются металлы — серебро и золото (срез «металлы»). Через CFD имеет смысл торговать только их; акции — на бирже, где у лонга нет свопа (гипотеза H04)."
S05:
  what: "Проскальзывание 0.1% на входе и на выходе вместо 0.05%, остальное как в базе."
  why: "Запас прочности: сколько ухудшения исполнения выдерживает стратегия."
  outcome: "Портфель 4 в минусе, металлы в слабом плюсе. Запаса почти нет: при свопах брокера стратегия держится на грани."
S06:
  what: "Проскальзывание 0.15% на входе и на выходе."
  why: "Найти точку безубытка металлов."
  outcome: "Металлы уходят в минус — безубыток около 0.13% на сторону."
S07:
  what: "Проскальзывание 0.2% на входе и на выходе."
  why: "Стресс-тест исполнения."
  outcome: "Убыток на всех срезах."
S08:
  what: "Проскальзывание 0.3% на входе и на выходе."
  why: "Стресс-тест исполнения."
  outcome: "Большой убыток. Без свопов безубыток был около 0.25% на сторону, со свопами — около 0.13% у металлов и меньше 0.05% у портфеля 4."
S10:
  what: "К базе добавлен выход по развороту тренда: сделка закрывается по закрытию часа, когда гейт C становится противоположным её направлению (тренд — только по закрытой свече). Пересчитано на всех 8 рынках с дивидендами, стопом по гэпу и издержками базы."
  why: "Держать позицию, пока тренд не развернулся, и не отдавать прибыль обратно; короче удержание — меньше свопов."
  outcome: "Хуже базы, особенно на металлах. Срезаются крупные движения, ради которых стратегия держит позицию, а экономия на свопах этого не окупает."
S11:
  what: "Стоп и трейлинг 3 ATR вместо 6 (трейлинг включается после +1.5 ATR), выход не позже 240 часов. Все 8 рынков, издержки базы."
  why: "Ближний стоп — меньше убыток на сделку и короче удержание."
  outcome: "Хуже базы: сделок в 1.6 раза больше, узкий стоп выбивает рынок обычным шумом, а лишние сделки платят комиссию и проскальзывание."
S12:
  what: "Выход не позже 120 часов, стоп и трейлинг 6 ATR (трейлинг после +3 ATR). Все 8 рынков, издержки базы."
  why: "Вдвое короче удержание — вдвое меньше свопов (гипотеза H03)."
  outcome: "Не подтвердилось: на выборе 2016–2020 лучше базы, на проверке хуже, металлы теряют больше половины результата. Экономия на свопах меньше потери сигнала."
S13:
  what: "Выход не позже 48 часов, стоп и трейлинг 4 ATR (трейлинг после +2 ATR). Все 8 рынков, издержки базы."
  why: "Короткое удержание — почти без свопов."
  outcome: "Хуже базы в обоих периодах: импульс отрабатывает за несколько дней, короткий выход забирает лишь начало хода."
S14:
  what: "Вход по любому импульсу 6 ч / 3 ATR в его сторону, без проверки тренд-гейта C. Выход как в базе, все 8 рынков."
  why: "Нужен ли тренд-фильтр вообще."
  outcome: "Заметно хуже базы — тренд-фильтр нужен, особенно на акциях."
S15:
  what: "Входить, только если ATR сигнального часа не ниже медианы ATR обучающего периода. Выход как в базе, все 8 рынков."
  why: "Преимущество должно быть больше в активном рынке; сделок вдвое меньше — меньше и свопов."
  outcome: "Не подтвердилось: на выборе 2016–2020 заметно лучше базы, на проверке — как база, на металлах чуть хуже. Кандидат, но включать рано."
S16:
  what: "Импульс — ход за 8 часов не меньше 3.5 ATR вместо 6 часов и 3 ATR. Выход как в базе, все 8 рынков."
  why: "Более длинное и сильное движение может лучше продолжаться."
  outcome: "Хуже базы в обоих периодах — 6 ч / 3 ATR остаётся."
S17:
  what: "Сделки S03 с издержками брокера Альфа-Форекс: спред вместо комиссии и проскальзывания (серебро 90 пунктов ≈ 0.12% при шаге цены 0.001, акции 0.15%, эфир 0.09%, золото 0.01%) и те же свопы, что в базе."
  why: "Сколько стоит исполнение у конкретного брокера по сравнению с заложенными в базу 0.04% + 2 × 0.05%."
  outcome: "Портфель 4 — как база: спред акций 0.15% почти равен заложенным 0.14%. Металлы лучше базы — у золота спред брокера всего 0.01%."
S18:
  what: "То же, если серебро котируется с 4 знаками (1 пункт = 0.0001): спред серебра ≈ 0.012%, его свопы в 10 раз меньше."
  why: "Размер пункта серебра у брокера не уточнён, а от него зависит судьба серебра."
  outcome: "Серебро сохраняет результат целиком, металлы — как до учёта свопов. Шаг цены серебра — главный открытый вопрос к брокеру."
S19:
  what: "Условия Альфа-Форекс, но выход не позже 168 часов, стоп и трейлинг 4 ATR (трейлинг после +2 ATR). Сделки заново посчитаны штатным симулятором с дивидендами и стопом по гэпу."
  why: "Короче удержание — меньше переносов и свопов. Это лучший по профит-фактору вариант сетки на 2016–2020."
  outcome: "Около нуля — экономия на свопах меньше потери сигнала."
S20:
  what: "Условия Альфа-Форекс, выход не позже 120 часов, стоп и трейлинг 6 ATR."
  why: "Короче удержание при том же стопе."
  outcome: "Убыток."
S21:
  what: "Условия Альфа-Форекс, выход не позже 72 часов, стоп и трейлинг 3 ATR."
  why: "Ещё короче удержание."
  outcome: "Около нуля — короткая сделка забирает лишь начало хода."
S22:
  what: "Выход не позже 168 часов, стоп и трейлинг 4 ATR (трейлинг после +2 ATR) при издержках базы."
  why: "Короче удержание — меньше свопов; этот выход был лучшим по сетке на 2016–2020 под условиями брокера."
  outcome: "Портфель 4 чуть выше базы — в пределах шума, металлы заметно хуже. Не помогло."
S23:
  what: "Пока трейлинг не включился, первые 12 часов после входа стоп стоит в 3 ATR от входа вместо 6, потом — обычный. Исполнение по гэпу, как у обычного стопа. Перебрали стоп 2, 3, 4 ATR и срок 12, 24, 48 часов на всех 8 рынках; этот вариант — лучший по выбору 2016–2020."
  why: "Тимур заметил, что хорошие сделки почти не уходят в минус. Это подтвердилось: за первые 24 часа против позиции медиана 1.35 ATR у выигрышных и 2.76 ATR у убыточных. Ранний выход должен резать убыточные сделки раньше."
  outcome: "Не помогло. На выборе ни один вариант не лучше базы; на металлах ранний стоп хуже и на проверке — он срезает и те сделки, что потом отыгрываются, а среди них крупные выигрыши. На акциях слабый плюс за счёт экономии свопов, но акции через CFD убыточны и так."
S24:
  what: "Сделки базы, но акции торгуются на Мосбирже, а не через CFD: лонг своими деньгами не платит за перенос, шорт платит брокеру 0.05% цены за каждую календарную ночь (ставка — допущение), комиссия брокера и биржи 0.1% за круг, проскальзывание как в базе. Металлы и эфир — как в базе."
  why: "Через CFD акции убыточны из-за платы за перенос 0.068% в день в обе стороны (гипотеза H04)."
  outcome: "Портфель 4 из минуса уходит в плюс: на бирже переносят бесплатно лонги. Но шорты по акциям убыточны сами по себе (акции растут и платят дивиденды), поэтому результат сильно зависит от ставки шорта: безубыток около 0.08–0.12% в день."
S25:
  what: "То же, что S24, но по акциям открываются только лонги: шортовые сигналы гасятся до симуляции и не занимают время. Металлы и эфир — в обе стороны, как в базе."
  why: "Шорт по акциям проигрывает даже без платы за перенос: на выборе 2016–2020 и на проверке шорты акций в минусе."
  outcome: "Лучший результат на честных издержках: портфель 4 +53% на проверке (PF 1.29) и +46% на выборе. Газпром, Сбербанк и Лукойл в плюсе в обоих периодах. На свежих данных июнь–октябрь 2026 три бумаги вместе +6.7% — столько, сколько ожидалось. Налог 13% с дивидендов не учтён — он стоит 1–3 п.п."
M01:
  what: "Модель CatBoost (градиентный бустинг деревьев решений) по 81 признаку часовых баров серебра. Разметка на 3 класса — «рост», если цена прошла +1.5 ATR раньше −0.75 ATR в следующие 10 часов, «падение» — наоборот, иначе «ничего». Каждый год модель учится на данных до 1 января (часть последних данных — для ранней остановки) и торгует весь год. Сделка открывается, если ожидаемая выгода по вероятности класса с учётом комиссии положительна и направление совпадает с тренд-гейтом; стоп 2 ATR, трейлинг 1.5 ATR после +1 ATR, выход через 10 часов. Три прогона с разными seed, метрики усреднены."
  why: "Базовая постановка проекта — прогноз ближайшего движения."
  outcome: "Средняя сделка после комиссии едва выше нуля — преимущество модели равно комиссии."
M02:
  what: "Та же модель, но обучающая выборка — только часы, где гейт C разрешает вход; остальные часы (около двух третей) из обучения убраны. Торговля та же. Четыре прогона с разными seed."
  why: "Модель тратила силы на нейтральные часы, где сделок всё равно не бывает."
  outcome: "На проверке 2021–2026 лучше базы, но разница сравнима с разбросом между базовыми прогонами — перепроверяем (гипотеза H31)."
M03:
  what: "Вместо трёх классов по барьерам — класс по знаку хода за 4 часа, если ход больше 0.3 ATR, иначе «ничего». Остальное как в базе. Один прогон."
  why: "Барьеры могли учить модель волатильности, а не направлению."
  outcome: "Хуже базы — модель всё равно опирается на волатильность, прибыльна в 3 годах из 8."
M04:
  what: "Регрессия — модель предсказывает величину хода через 4 часа в ATR; сделка, если прогноз больше 0.3 ATR в одну из сторон."
  why: "Спросить модель напрямую «куда и на сколько»."
  outcome: "Ранняя остановка оставляет 1–4 дерева, прогноз почти никогда не выходит за порог — сигнала нет, сделок единицы."
M05:
  what: "Те же признаки и разметка, но более осторожное обучение — шаг 0.02, глубина деревьев 4, регуляризация L2 10, терпение ранней остановки 300, до 3000 деревьев. Три seed."
  why: "С обычными настройками модель останавливалась на 20–240 деревьях и сильно зависела от seed."
  outcome: "Стабильнее между seed, но не лучше базы."
M06:
  what: "Три модели с разными seed обучаются на одном окне, их вероятности усредняются. Три таких ансамбля."
  why: "Усреднение должно погасить случайность одной модели."
  outcome: "Разброс результатов не уменьшился — он идёт от последовательности сделок (одна сдвинутая сделка меняет все следующие), а не от модели."
M07:
  what: "Один прогон (seed 42), в котором дополнительно обучалась мета-модель; здесь — сделки основной модели без мета-фильтра."
  why: "База для M08 — тот же прогон, чтобы сравнивать только эффект мета-модели."
  outcome: "База."
M08:
  what: "Вторая модель (мета-модель) решает, брать ли сделку основной модели. Её признаки — ход и свеча относительно стороны сделки, класс входа (продолжение, плоско, откат, «нож»), результаты последних 10 и 30 сделок, режим рынка. Сделка — если вероятность успеха не ниже 0.50."
  why: "Отсеять плохие сделки основной модели по контексту, которого у неё нет."
  outcome: "AUC мета-модели 0.47–0.53 во всех годах — она не отличает удачные сделки от неудачных; итог как у базы."
M09:
  what: "Прогон с обученной моделью волатильности (3 seed); здесь — сделки основной модели с размером позиции 1."
  why: "База для M10–M12 — те же сделки, меняется только размер позиции."
  outcome: "База."
M10:
  what: "Размер позиции = ATR сигнального часа / медиана ATR обучающего периода (не больше 2). Комиссия масштабируется размером. Сделки те же, что в M09."
  why: "Преимущество в процентах растёт с волатильностью, а комиссия — нет; значит, в активном рынке стоит торговать больше."
  outcome: "t и профит-фактор лучше базы на всех seed — единственное устойчивое улучшение модели. Итог в процентах выше и за счёт большего среднего размера позиции."
M11:
  what: "Торговать только если ATR сигнального часа не ниже медианы обучающего периода; размер 1."
  why: "Тот же эффект, но без увеличения позиции."
  outcome: "Сделок меньше, ожидание на сделку выше вдвое; t выше базы."
M12:
  what: "Размер позиции по прогнозу волатильности отдельной моделью CatBoost (средний размах на 10 часов вперёд) вместо текущего ATR."
  why: "Прогноз волатильности точнее текущего ATR."
  outcome: "Прогноз действительно точнее (корреляция с фактом 0.76 против 0.40), но для размера хуже наивного ATR — модель ловит час суток, а преимущество связано с уровнем волатильности периода."
M13:
  what: "Прогон вариантов тренд-гейта (3 seed); здесь — сделки основной модели с гейтом C."
  why: "База для M14–M17 — та же модель, меняется только правило входа или признаки."
  outcome: "База."
M14:
